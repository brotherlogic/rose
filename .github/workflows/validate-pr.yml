name: Validate PR

on:
  pull_request:
    branches:
      - main

jobs:
  validate-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build container image locally
        run: docker build -t rose-gallery-test:${{ github.sha }} .

      - name: Run container detached
        run: docker run -d --name test-gallery -p 8080:80 rose-gallery-test:${{ github.sha }}

      - name: Polling healthcheck loop
        run: |
          SUCCESS=0
          for i in $(seq 1 15); do
            echo "Healthcheck attempt $i/15..."
            if curl -s -f http://localhost:8080/healthz > /dev/null; then
              echo "Healthcheck passed: /healthz returned 200 OK."
              SUCCESS=1
              break
            fi
            sleep 2
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Container healthcheck timed out or failed! Capturing container logs:"
            docker logs test-gallery || true
            echo "Stopping and removing container..."
            docker stop test-gallery || true
            docker rm test-gallery || true
            exit 1
          fi

          echo "Validating root page branding..."
          ROOT_HTML=$(curl -s -f http://localhost:8080/)
          if ! echo "$ROOT_HTML" | grep -q "ROSE SERAPHINE TUCKER" || ! echo "$ROOT_HTML" | grep -q "The Permanent Collection"; then
            echo "Branding verification failed! Root page content missing expected titles."
            docker logs test-gallery || true
            docker stop test-gallery || true
            docker rm test-gallery || true
            exit 1
          fi

          echo "Validating existing artwork image and thumbnail return 200..."
          docker exec test-gallery sh -c 'echo "img" > /data/images/test.jpg && echo "thumb" > /data/thumbnails/test.webp'
          IMG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/data/images/test.jpg)
          THUMB_OK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/data/thumbnails/test.webp)
          if [ "$IMG_STATUS" -ne 200 ] || [ "$THUMB_OK_STATUS" -ne 200 ]; then
            echo "Artwork media serving failed: expected 200, got image=$IMG_STATUS thumbnail=$THUMB_OK_STATUS"
            docker logs test-gallery || true
            docker stop test-gallery || true
            docker rm test-gallery || true
            exit 1
          fi

          echo "Validating missing thumbnail returns 404..."
          THUMB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/data/thumbnails/nonexistent.webp)
          if [ "$THUMB_STATUS" -ne 404 ]; then
            echo "Thumbnail 404 isolation failed: expected 404, got $THUMB_STATUS"
            docker logs test-gallery || true
            docker stop test-gallery || true
            docker rm test-gallery || true
            exit 1
          fi

          echo "Container healthcheck successful. Stopping and removing container..."
          docker stop test-gallery
          docker rm test-gallery
          exit 0
