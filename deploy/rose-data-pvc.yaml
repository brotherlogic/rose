# Specification: Ceph Persistent Volume Claim for Rose
# Reference: brotherlogic/prod#968
# Parent Rose Specifications: brotherlogic/rose#29, brotherlogic/rose#55, brotherlogic/rose#56, brotherlogic/rose#57
# Container Contract:
#   mountPath: /data
#   securityContext:
#     fsGroup: 65532

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rose-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 20Gi
