# Specification: Ceph Persistent Volume Claim for Rose
# Reference: brotherlogic/prod#968, brotherlogic/prod#1024
# Parent Rose Specifications: brotherlogic/rose#29, brotherlogic/rose#55, brotherlogic/rose#56, brotherlogic/rose#57, brotherlogic/rose#312, brotherlogic/rose#350
# Container Contract:
#   mountPath: /data
#   securityContext:
#     fsGroup: 65532

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rose-data-pvc
  namespace: rose
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ceph-filesystem
  resources:
    requests:
      storage: 50Gi
